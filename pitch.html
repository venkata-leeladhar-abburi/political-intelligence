html.locked,html.locked body{overflow:hidden;height:100%}
.gate{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px 16px calc(24px + env(safe-area-inset-bottom));background:#060607;color:#f4f2ee;font-family:Urbanist,Inter,system-ui,sans-serif;transition:opacity .45s ease,visibility .45s}
.gate::before{content:"";position:absolute;inset:auto -20% -40% -20%;height:70%;background:radial-gradient(60% 60% at 50% 100%,rgba(254,136,27,.22),rgba(202,69,255,.10) 45%,transparent 75%);pointer-events:none}
.gate.out{opacity:0;visibility:hidden}
.gate-card{position:relative;width:100%;max-width:440px;padding:clamp(28px,5vw,44px);border-radius:28px;background:#111114;border:1px solid rgba(255,255,255,.08);box-shadow:0 30px 80px rgba(0,0,0,.5)}
.gate-brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;letter-spacing:.01em;color:#cfcac2}
.gate-brand i{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,#ca45ff,#fe881b 60%,#ffb340)}
.gate-k{margin:30px 0 8px;font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#fe881b}
.gate h1{margin:0;font-size:clamp(30px,6vw,40px);line-height:1.08;font-weight:700;letter-spacing:-.02em}
.gate-p{margin:12px 0 26px;font-size:17px;line-height:1.5;color:#a9a39a}
.gate-code{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(6px,2vw,10px)}
.gate-code span{display:flex;align-items:center;justify-content:center;aspect-ratio:4/5;border-radius:14px;background:#0a0a0c;border:1.5px solid rgba(255,255,255,.12);font-size:clamp(24px,6vw,30px);font-weight:700;font-variant-numeric:tabular-nums;transition:border-color .15s,background .15s}
.gate-code span.on{border-color:#fe881b;background:#140e09}
.gate-code span.fill{border-color:rgba(255,255,255,.28)}
.gate-code input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;padding:0;cursor:text}
.gate-code.bad{animation:gshake .4s}
@keyframes gshake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.gate-btn{margin-top:22px;width:100%;min-height:56px;border:0;border-radius:16px;background:#fe881b;color:#160b02;font:inherit;font-size:17px;font-weight:700;cursor:pointer;transition:filter .15s,opacity .15s}
.gate-btn:hover{filter:brightness(1.08)}
.gate-btn:disabled{opacity:.55;cursor:default}
.gate-btn:focus-visible,.gate-code input:focus-visible+span{outline:2px solid #ffb340;outline-offset:3px}
.gate-msg{min-height:24px;margin:14px 0 0;font-size:15px;color:#ff8a7a}
.gate-ft{position:relative;font-size:14px;color:#77716a}
.gate-ft a{color:#cfcac2;text-decoration:none}
.gate.busy .gate-card>*:not(.gate-brand):not(.gate-wait){visibility:hidden}
.gate-wait{display:none}
.gate.busy .gate-wait{display:block;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px;color:#a9a39a}
@media (prefers-reduced-motion:reduce){.gate,.gate-code span{transition:none}.gate-code.bad{animation:none}}
@media print{.gate{display:none}}

<script>
(function () {
  var V = JSON.parse(document.getElementById('vault').textContent);
  var KEY = 'pi-pitch-pass';
  var gate = document.getElementById('gate'), form = document.getElementById('gateForm');
  var input = document.getElementById('gateIn'), btn = document.getElementById('gateBtn');
  var msg = document.getElementById('gateMsg'), code = document.getElementById('gateCode');
  var boxes = code.querySelectorAll('span');
  var bytes = function (s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
  var store = { get: function () { try { return sessionStorage.getItem(KEY); } catch (e) { return null; } },
                set: function (v) { try { sessionStorage.setItem(KEY, v); } catch (e) {} },
                del: function () { try { sessionStorage.removeItem(KEY); } catch (e) {} } };

  function paint() {
    var v = input.value, focused = document.activeElement === input;
    for (var i = 0; i < 6; i++) {
      boxes[i].textContent = v[i] ? '\u2022' : '';
      boxes[i].className = (v[i] ? 'fill' : '') + (focused && i === Math.min(v.length, 5) ? ' on' : '');
    }
    btn.disabled = v.length !== 6;
  }

  async function open(pass) {
    var c = crypto.subtle, enc = new TextEncoder();
    var base = await c.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
    var key = await c.deriveKey({ name: 'PBKDF2', salt: bytes(V.s), iterations: V.n, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var plain = await c.decrypt({ name: 'AES-GCM', iv: bytes(V.i) }, key, bytes(V.c));
    return JSON.parse(new TextDecoder().decode(plain));
  }

  function show(deck) {
    gate.insertAdjacentHTML('beforebegin', deck.html);
    document.documentElement.classList.remove('locked');
    var s = document.createElement('script'); s.textContent = deck.js; document.body.appendChild(s);
    gate.classList.add('out');
    setTimeout(function () { gate.remove(); document.getElementById('vault').remove(); }, 500);
    if (location.hash) { var t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
  }

  async function attempt(pass, quiet) {
    gate.classList.add('busy'); msg.textContent = '';
    try {
      var deck = await open(pass);
      store.set(pass); show(deck);
    } catch (e) {
      store.del(); gate.classList.remove('busy');
      if (!window.crypto || !crypto.subtle) { msg.textContent = 'This browser cannot open the presentation. Try a current version of Chrome, Safari or Edge.'; return; }
      if (!quiet) {
        msg.textContent = "That passcode didn't work. Check it and try again.";
        code.classList.remove('bad'); void code.offsetWidth; code.classList.add('bad');
      }
      input.value = ''; paint(); input.focus();
    }
  }

  input.addEventListener('input', function () {
    input.value = input.value.replace(/\D/g, '').slice(0, 6);
    msg.textContent = ''; paint();
    if (input.value.length === 6) attempt(input.value);
  });
  input.addEventListener('focus', paint);
  input.addEventListener('blur', paint);
  form.addEventListener('submit', function (e) { e.preventDefault(); if (input.value.length === 6) attempt(input.value); });

  var saved = store.get();
  if (saved) attempt(saved, true); else { paint(); input.focus(); }
})();
</script>
